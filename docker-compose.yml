services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smartseba
      POSTGRES_PASSWORD: smartseba
      POSTGRES_DB: smartseba
    ports:
      - "5433:5432"
    volumes:
      - "smartseba_pg:/var/lib/postgresql/data"

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smartseba
      MINIO_ROOT_PASSWORD: smartseba
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "smartseba_minio:/data"

volumes:
  smartseba_pg:
  smartseba_minio: